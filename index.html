<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gente • Strange Attractor Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050711;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud {
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(10, 15, 32, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
    }
    .hud h1 { font-size: 15px; letter-spacing: 0.4px; color: #38bdf8; }
    .hud p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>
  <canvas id="cosmos"></canvas>
  <div class="hud">
    <h1>Gente • Strange Attractor Lab</h1>
    <p id="status">Mueve el cursor para perturbar el campo gravitacional</p>
  </div>
  <script>
    const canvas = document.getElementById('cosmos');
    const ctx = canvas.getContext('2d');
    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);
    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const mouse = { x: w / 2, y: h / 2 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    const particles = Array.from({ length: 180 }, (_, i) => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 1.4,
      vy: (Math.random() - 0.5) * 1.4,
      hue: (i * 2.3) % 360,
    }));

    function tick() {
      ctx.fillStyle = 'rgba(5, 7, 17, 0.14)';
      ctx.fillRect(0, 0, w, h);

      for (const p of particles) {
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.hypot(dx, dy) + 32;
        p.vx += (dx / dist) * 0.25 - (dy / dist) * 0.12;
        p.vy += (dy / dist) * 0.25 + (dx / dist) * 0.12;
        p.vx *= 0.965;
        p.vy *= 0.965;
        p.x = (p.x + p.vx + w) % w;
        p.y = (p.y + p.vy + h) % h;

        ctx.fillStyle = `hsl(${p.hue}, 88%, 64%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.9, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
